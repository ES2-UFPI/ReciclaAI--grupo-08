name: CI do Django (Dev)

on:
  push:
    branches: [ "dev" ]
    paths: [ "BACK-END/**" ]
  pull_request:
    branches: [ "dev" ]
    paths: [ "BACK-END/**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Cache das dependências
      - name: Cache de dependências Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('BACK-END/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Instala dependências
      - name: Instalar dependências
        working-directory: ./BACK-END
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Verificar migrações pendentes
      - name: Verificar migrações
        working-directory: ./BACK-END
        run: |
          python manage.py makemigrations --check

      # 6. Rodar testes
      - name: Rodar testes
        working-directory: ./BACK-END
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python manage.py test
